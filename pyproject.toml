[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitbus"
version = "0.1.0"
description = "Split-Bus Architecture for Reliable Desktop Agents: Separating Realtime Interaction from Durable Asynchronous Execution"
readme = "README.md"
authors = [
    { name = "VirindaAI Research Team", email = "research@virinda.ai" },
    { name = "Anmol M.", email = "anmol@abhi.day" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.8"
]
benchmarks = [
    "matplotlib>=3.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/splitbus"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv", "build", "dist"]
skips = ["B101", "B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
